name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check scripts/ dags/ dashboard/

      - name: Bronze ingest
        run: python scripts/bronze_ingest.py

      - name: dbt build
        run: dbt build --project-dir . --profiles-dir .
        working-directory: dbt

